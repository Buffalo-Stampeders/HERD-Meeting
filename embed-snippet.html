<!-- Buffalo HERD Meeting course — paste this whole block into a Code / HTML block on your site.
     The frame grows and shrinks to fit the course, so there's no inner scrollbar.
     HEADER_OFFSET: height in pixels of any sticky header on your site, so "back to top" doesn't hide the course under it. -->
<iframe id="herd-course"
        src="https://buffalo-stampeders.github.io/HERD-Meeting/course.html"
        title="Buffalo HERD Meeting"
        style="width:100%;height:900px;border:0;display:block;overflow:hidden"
        scrolling="no"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen></iframe>
<script>
(function () {
  var HEADER_OFFSET = 100;
  var ORIGIN = "https://buffalo-stampeders.github.io";
  var frame = document.getElementById("herd-course");
  var inProgress = false;   // true while a learner is part-way through: leaving the page asks them to confirm
  function sendViewport() {
    if (!frame.contentWindow) return;
    var r = frame.getBoundingClientRect(), vh = window.innerHeight || document.documentElement.clientHeight;
    var top = Math.max(0, -r.top), bottom = Math.min(r.height, vh - r.top);
    frame.contentWindow.postMessage({ type: "herd-viewport", top: top, height: Math.max(0, bottom - top) }, ORIGIN);
  }
  window.addEventListener("message", function (e) {
    if (e.origin !== ORIGIN || e.source !== frame.contentWindow || !e.data) return;
    if (e.data.type === "herd-height" && e.data.height > 0) { frame.style.height = Math.ceil(e.data.height) + "px"; sendViewport(); }
    else if (e.data.type === "herd-ready") sendViewport();
    else if (e.data.type === "herd-progress") inProgress = !!e.data.active;
    else if (e.data.type === "course-complete") inProgress = false;
    else if (e.data.type === "herd-scroll-top") {
      var r = frame.getBoundingClientRect();
      if (r.top < HEADER_OFFSET || r.top > window.innerHeight * 0.4) window.scrollTo({ top: window.pageYOffset + r.top - HEADER_OFFSET, behavior: "smooth" });
    }
  });
  window.addEventListener("beforeunload", function (e) { if (inProgress) { e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("scroll", sendViewport, { passive: true });
  window.addEventListener("resize", sendViewport);
})();
</script>
