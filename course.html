<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Course</title>
<link rel="stylesheet" href="https://use.typekit.net/vvm7dvi.css">
<style>
  /* Palette and type lifted from tvcs.org (Elementor globals + Adobe Fonts kit vvm7dvi) */
  :root{
    --green:#00492B; --green-dark:#003620; --bronze:#BC9B6A; --tan:#E0C990; --cream:#FAF3DD; --cream-light:#FFFBEE;
    --ink:#333333; --muted:#6b6b6b; --line:#e3dccb; --bg:#ffffff;
    --ok:#1b7f3b; --bad:#C24643;
    --font-head:"ivyjournal", Georgia, "Times New Roman", serif;
    --font-body:"indivisible", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
  .course{max-width:920px;margin:0 auto;padding:16px}
  h1,h2,h3{font-family:var(--font-head);font-weight:800;line-height:1.1;margin:0;color:var(--green)}
  h1{font-size:clamp(26px,3.5vw,36px)}
  h2{font-size:clamp(20px,2.6vw,26px)}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--bronze);margin-bottom:6px}
  .header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px solid var(--bronze);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
  .header .who{font-size:13px;font-weight:600;color:var(--green)}
  .progress{display:flex;gap:4px;margin:14px 0 22px}
  .progress span{flex:1;height:6px;background:var(--line)}
  .progress span.done{background:var(--green)}
  .progress span.current{background:var(--tan)}
  .card{background:var(--cream);border-top:4px solid var(--green);padding:26px;margin-bottom:18px}
  label{display:block;font-size:11px;font-weight:700;color:var(--green);margin:14px 0 5px;text-transform:uppercase;letter-spacing:2px}
  input[type=text],input[type=email]{width:100%;font:inherit;font-weight:500;padding:11px 13px;border:1px solid var(--bronze);border-radius:3px;background:#fff;color:var(--green)}
  input:focus{outline:2px solid var(--green);outline-offset:1px}
  .btn{display:inline-block;font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:var(--green);color:#fff;border:0;border-radius:0;padding:14px 28px;cursor:pointer;margin-top:18px;transition:background .15s}
  .btn:hover{background:var(--bronze)}
  .btn[disabled]{background:#9aa39e;cursor:not-allowed}
  .btn.secondary{background:transparent;color:var(--green);border:2px solid var(--green)}
  .video-wrap{position:relative;background:#000;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line)}
  .video-wrap video,.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;border:0}
  .video-wrap .embed-host{position:absolute;inset:0}
  .video-wrap .embed-host > *{width:100%!important;height:100%!important}
  .rich-html{font-size:16px;line-height:1.6}
  .rich-html h2{font-family:var(--font-head);font-weight:800;font-size:22px;color:var(--green);margin:16px 0 6px}
  .rich-html h3{font-family:var(--font-head);font-weight:800;font-size:18px;color:var(--bronze);margin:14px 0 4px}
  .rich-html p{margin:0 0 10px} .rich-html ul,.rich-html ol{margin:0 0 10px;padding-left:26px}
  .rich-html blockquote{margin:12px 0;padding:10px 14px;border-left:4px solid var(--bronze);background:var(--cream-light)}
  .rich-html a{color:var(--green);font-weight:600}
  .text-body{background:#fff;border:1px solid var(--line);padding:22px 24px}
  /* placeholder image in a video module */
  .video-wrap .placeholder{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in;background:var(--green)}
  .video-wrap .placeholder-default{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--green);color:var(--tan);font-family:var(--font-head);font-weight:800;font-size:22px;text-align:center;padding:20px}
  .video-wrap .placeholder-default small{font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--bronze)}
  /* photo gallery */
  .gallery-stage{position:relative;background:#000;aspect-ratio:16/9;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .gallery-stage img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;display:block}
  .gal-nav,.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:40px;line-height:1;cursor:pointer;transition:background .15s}
  .gal-nav:hover,.lb-nav:hover{background:var(--green)}
  .gal-nav.prev,.lb-nav.prev{left:0} .gal-nav.next,.lb-nav.next{right:0}
  .gallery.single .gal-nav,.gallery.single .gallery-thumbs{display:none}
  .gal-expand{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.5);color:#fff;font-size:16px;padding:4px 8px;pointer-events:none}
  .gallery-caption{font-size:14px;color:var(--muted);padding:8px 2px;min-height:1.4em}
  .gallery-thumbs{display:flex;gap:6px;flex-wrap:wrap}
  .gallery-thumbs img{width:72px;height:48px;object-fit:cover;border:2px solid transparent;cursor:pointer;opacity:.7}
  .gallery-thumbs img.active{border-color:var(--green);opacity:1}
  /* lightbox */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .lightbox figure{margin:0;max-width:95vw;max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:10px}
  .lightbox img{max-width:95vw;max-height:84vh;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .lightbox figcaption{color:var(--tan);font-size:15px;text-align:center}
  .lb-close{position:absolute;top:10px;right:14px;background:transparent;border:0;color:#fff;font-size:44px;line-height:1;cursor:pointer}
  .lb-count{position:absolute;top:22px;left:20px;color:var(--bronze);font-size:11px;font-weight:700;letter-spacing:3px}
  .lightbox.single .lb-nav,.lightbox.single .lb-count{display:none}
  @media (max-width:600px){ .gal-nav,.lb-nav{width:36px;height:52px;font-size:30px} }
  .notes{margin-top:14px;border:1px solid var(--line);background:#fff}
  .notes-toggle{display:block;width:100%;text-align:left;font:inherit;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);background:var(--cream-light);border:0;padding:11px 14px;cursor:pointer}
  .notes-toggle::before{content:"▸";display:inline-block;margin-right:8px;transition:transform .15s}
  .notes-toggle[aria-expanded=true]::before{transform:rotate(90deg)}
  .notes-body{padding:14px 16px;font-size:15px}
  .notes.collapsed .notes-body{display:none}
  .segment-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .segment-title .count{font-size:11px;font-weight:700;color:var(--bronze);text-transform:uppercase;letter-spacing:3px}
  .note{font-size:14px;color:var(--muted);margin-top:10px}
  .quiz{margin-top:20px;border-top:1px solid var(--bronze);padding-top:18px}
  .quiz.locked{opacity:.45;pointer-events:none}
  fieldset{border:0;padding:0;margin:0 0 20px}
  legend{font-family:var(--font-head);font-weight:800;font-size:18px;color:var(--green);margin-bottom:10px;line-height:1.2}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border:1px solid var(--line);border-radius:0;background:#fff;margin-bottom:6px;cursor:pointer;font-weight:500}
  .opt:hover{border-color:var(--bronze)}
  .opt:has(input:checked){border-color:var(--green);background:var(--cream-light);box-shadow:inset 3px 0 0 var(--green)}
  .opt input{margin-top:4px;accent-color:var(--green)}
  .opt.correct{border-color:var(--ok);background:#e8f5ec}
  .opt.wrong{border-color:var(--bad);background:#fdecea}
  .feedback{font-weight:700;margin-top:8px;font-size:15px}
  .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
  .status{font-size:14px;color:var(--muted);margin-top:8px;min-height:1.2em}
  .done-card{text-align:center;padding:44px 22px;background:var(--green);border-top-color:var(--bronze)}
  .done-card h2{color:#fff} .done-card .note{color:var(--tan)}
  .done-card .big{font-size:56px;color:var(--tan);font-family:var(--font-head);font-weight:800;line-height:1}
  .hidden{display:none !important}
  .header-right{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .lang-wrap{display:flex;align-items:center;gap:6px;margin:0;font-size:16px;letter-spacing:0;text-transform:none}
  .lang-pick{font:inherit;font-size:13px;font-weight:600;color:var(--green);border:1px solid var(--bronze);background:#fff;padding:5px 8px;border-radius:3px;cursor:pointer}
  /* captions overlay for YouTube / Vimeo */
  .cc-overlay{position:absolute;left:0;right:0;bottom:13%;display:flex;justify-content:center;pointer-events:none;z-index:3;padding:0 6%}
  .cc-overlay span{background:rgba(0,0,0,.8);color:#fff;font-size:clamp(14px,2.3vw,22px);line-height:1.35;padding:4px 10px;text-align:center;white-space:pre-line;max-width:100%}
  .cc-overlay span:empty{display:none}
  .cc-btn,.fs-btn{position:absolute;top:8px;z-index:4;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.45);font:inherit;font-size:11px;font-weight:700;letter-spacing:1px;padding:5px 9px;cursor:pointer}
  .cc-btn{left:8px} .fs-btn{left:58px}
  .cc-btn[aria-pressed=false]{opacity:.6;text-decoration:line-through}
  .video-wrap:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0}
  .video-wrap:fullscreen .cc-overlay span{font-size:clamp(20px,3vw,40px)}
  html[dir=rtl] .opt{text-align:right} html[dir=rtl] .video-wrap{direction:ltr}
  @media (max-width:600px){ .card{padding:18px} }
</style>
</head>
<body>
<div class="course" id="app">
  <div class="header">
    <h1 id="courseTitle">Training Course</h1>
    <div class="header-right">
      <label class="lang-wrap hidden" id="langWrap"><span aria-hidden="true">&#127760;</span><select id="langPick" class="lang-pick" aria-label="Language"></select></label>
      <div class="who" id="who"></div>
    </div>
  </div>
  <div class="progress" id="progress"></div>

  <!-- Step 0: identify the learner -->
  <section class="card" id="startCard">
    <div class="eyebrow" data-ui="signIn">Sign in</div>
    <h2 data-ui="beforeBegin">Before you begin</h2>
    <p class="note" id="courseIntro"></p>
    <form id="startForm" autocomplete="on">
      <label for="name" data-ui="fullName">Full name</label>
      <input type="text" id="name" required placeholder="First and last name" data-ui-ph="namePh">
      <label for="email" data-ui="email">Email address</label>
      <input type="email" id="email" required placeholder="you@example.com">
      <button class="btn" type="submit" data-ui="start">Start course</button>
    </form>
  </section>

  <!-- Step 1..n: a video segment + its quiz -->
  <section class="card hidden" id="segmentCard">
    <div class="segment-title">
      <div><div class="eyebrow" id="segCount"></div><h2 id="segTitle"></h2></div>
    </div>
    <div class="video-wrap" id="videoWrap"></div>
    <div class="text-body rich-html hidden" id="textBody"></div>
    <div class="gallery hidden" id="gallery">
      <div class="gallery-stage">
        <button type="button" class="gal-nav prev" id="galPrev" aria-label="Previous image">&#8249;</button>
        <img id="galImg" alt="">
        <button type="button" class="gal-nav next" id="galNext" aria-label="Next image">&#8250;</button>
        <span class="gal-expand" aria-hidden="true">&#x26F6;</span>
      </div>
      <div class="gallery-caption" id="galCaption"></div>
      <div class="gallery-thumbs" id="galThumbs"></div>
    </div>
    <p class="note" id="videoNote"></p>
    <div class="notes hidden" id="notes">
      <button type="button" class="notes-toggle hidden" id="notesToggle" aria-expanded="false">Show notes</button>
      <div class="notes-body rich-html" id="notesBody"></div>
    </div>
    <div class="quiz locked" id="quiz">
      <form id="quizForm"></form>
      <div class="status" id="status"></div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true">
    <button type="button" class="lb-close" id="lbClose" aria-label="Close">&times;</button>
    <button type="button" class="lb-nav prev" id="lbPrev" aria-label="Previous">&#8249;</button>
    <figure><img id="lbImg" alt=""><figcaption id="lbCaption"></figcaption></figure>
    <button type="button" class="lb-nav next" id="lbNext" aria-label="Next">&#8250;</button>
    <div class="lb-count" id="lbCount"></div>
  </div>

  <!-- Done -->
  <section class="card done-card hidden" id="doneCard">
    <div class="big">&#10003;</div>
    <h2 id="doneTitle">Course complete</h2>
    <p class="note" id="doneNote"></p>
  </section>
</div>

<script>
/* =====================================================================
   CONFIG — this is the only block you need to edit.
   ===================================================================== */
// Course content is loaded live from the backend (edit it in admin.html).
// The values below are only the fallback used when nothing has been published yet.
let CONFIG = {
  courseTitle: "Buffalo HERD Volunteer Training",
  intro: "Watch each video, then answer the questions to unlock the next section.",

  // Where submissions are logged. Paste the Google Apps Script "Web app" URL
  // (see apps-script.gs). Leave empty to skip remote logging while testing.
  logEndpoint: "https://script.google.com/macros/s/AKfycbymna1peFFke8U96Dhyv-jQvQGNwtStQJP6-dGM9qB6cGTkviKNDVxSC6Nb3jbfDPOsGw/exec",

  // Must the learner watch the whole video before the quiz unlocks?
  requireFullWatch: true,
  // Keep video at 1x and prevent skipping ahead (file and YouTube players; Drive/BoxCast embeds can't be controlled).
  lockPlayback: true,
  // Must every answer be correct to advance? (false = one attempt, any score advances)
  requireAllCorrect: true,
  // Show which option was correct after a wrong attempt?
  revealCorrect: false,

  doneTitle: "Course complete",
  doneNote: "Your results have been recorded. You may close this page.",

  // One entry per video segment. videoType is "file" (direct .mp4/.mov URL), "youtube"
  // (any YouTube URL), or "boxcast" (the BoxCast embed code or URL). `notes` is optional
  // text shown under the video; notesCollapsed hides it behind a "Show notes" toggle.
  segments: [
    {
      title: "Section 1: Welcome",
      videoType: "file",
      video: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
      notes: "Placeholder notes. Replace this text, or leave notes empty to hide the box.",
      notesCollapsed: true,
      questions: [
        { q: "What color are the flowers in the video?",
          options: ["Red", "Yellow", "Blue", "White"], answer: 1 },
        { q: "What is the main subject of this clip?",
          options: ["A city street", "A flower in a garden", "A sports field", "A classroom"], answer: 1 }
      ]
    },
    {
      title: "Section 2: Policies & Expectations",
      video: "https://www.w3schools.com/html/mov_bbb.mp4",
      questions: [
        { q: "What kind of animal is the main character?",
          options: ["A rabbit", "A squirrel", "A bird", "A bear"], answer: 0 },
        { q: "Where does the clip take place?",
          options: ["Underwater", "In a meadow", "In space", "In a gym"], answer: 1 },
        { q: "Which of these should you do first in this section?",
          options: ["Skip the video", "Watch the whole video", "Email the coach", "Close the page"], answer: 1 }
      ]
    }
  ]
};
/* ===================================================================== */

const $ = (id) => document.getElementById(id);
const state = { name:"", email:"", idx:0, attempts:0, watched:false, startedAt:null, log:[], noteKey:null, cues:[], ccOn:true, playerKind:null };

/* ---------------- languages & translation ----------------
   English is the source. Translations are produced in admin.html and published inside the config as
   CONFIG.translations[lang][key] = { t, src, edited }, where src is a hash of the English text it was
   made from. If the English has changed since (hash mismatch) the English is shown instead of a stale translation.
   Keep UI in sync with the copy in admin.html. */
const UI = {
  signIn:"Sign in", beforeBegin:"Before you begin", fullName:"Full name", namePh:"First and last name",
  email:"Email address", start:"Start course", loading:"Loading course…", sectionOf:"Section {n} of {total}",
  watchToUnlock:"Watch the full video to unlock the questions below.", watchToContinue:"Watch the full video to continue.",
  answerBelow:"Answer the questions below to continue.", videoDoneAnswer:"Video complete — answer the questions below.",
  videoDoneContinue:"Video complete — click Continue.", submitContinue:"Submit & continue", submitFinish:"Submit & finish",
  cont:"Continue", finish:"Finish", recording:"Recording your answers…", recordingShort:"Recording…",
  correct:"Correct — {score}.", tryAgain:"{score} correct. Review the video and try again.",
  showNotes:"Show notes", hideNotes:"Hide notes", comingSoon:"Video coming soon", unavailable:"Video unavailable",
  unavailableBody:"This video could not be loaded.", preview:"PREVIEW — submissions not logged", captions:"Captions", fullscreen:"Full screen"
};
const LANG_NAMES = { en:"English", es:"Español", ht:"Kreyòl ayisyen", pt:"Português", fr:"Français", vi:"Tiếng Việt", "zh-CN":"中文（简体）",
  "zh-TW":"中文（繁體）", tl:"Tagalog", ar:"العربية", ru:"Русский", ko:"한국어", de:"Deutsch", it:"Italiano", ja:"日本語", pl:"Polski", uk:"Українська", hi:"हिन्दी" };
const RTL = new Set(["ar","he","iw","fa","ur"]);
let LANG = "en";
function h32(str){ let h = 5381; str = String(str ?? ""); for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function tr(key, src){
  src = src ?? "";
  if (LANG === "en" || !String(src).trim()) return src;
  const e = CONFIG.translations && CONFIG.translations[LANG] && CONFIG.translations[LANG][key];
  return (e && e.t && e.src === h32(src)) ? e.t : src;
}
function ui(k, vars){ let out = tr("ui:" + k, UI[k] || k); for (const [a, b] of Object.entries(vars || {})) out = out.split("{" + a + "}").join(b); return out; }
const segT = (seg, f) => tr(`s:${seg.id}:${f}`, seg[f] || "");
const capOf = im => tr(`i:${im.id}:caption`, im.caption || "");

function initLanguages(){
  const langs = (CONFIG.languages || []).filter(l => l && l !== "en");
  const options = ["en", ...langs];
  if (!langs.length) { LANG = "en"; $("langWrap").classList.add("hidden"); applyLangAttrs(); return; }
  $("langPick").innerHTML = options.map(l => `<option value="${l}">${esc(LANG_NAMES[l] || l)}</option>`).join("");
  let saved = null; try { saved = localStorage.getItem("courseLang"); } catch(_){}
  const nav = (navigator.languages || [navigator.language || "en"]).map(x => String(x).toLowerCase());
  LANG = (saved && options.includes(saved)) ? saved
       : (options.find(o => nav.some(n => n === o.toLowerCase())) || options.find(o => nav.some(n => n.split("-")[0] === o.split("-")[0].toLowerCase())) || "en");
  $("langPick").value = LANG; $("langWrap").classList.remove("hidden");
  applyLangAttrs();
}
function applyLangAttrs(){ document.documentElement.lang = LANG; document.documentElement.dir = RTL.has(LANG.split("-")[0]) ? "rtl" : "ltr"; }
function applyStatic(){
  const title = tr("c:courseTitle", CONFIG.courseTitle);
  $("courseTitle").textContent = title; document.title = title;
  $("courseIntro").textContent = tr("c:intro", CONFIG.intro);
  document.querySelectorAll("[data-ui]").forEach(el => el.textContent = ui(el.dataset.ui));
  document.querySelectorAll("[data-ui-ph]").forEach(el => el.placeholder = ui(el.dataset.uiPh));
  if (state.preview && !state.name) $("who").textContent = ui("preview");
  if (!$("doneCard").classList.contains("hidden")) { $("doneTitle").textContent = tr("c:doneTitle", CONFIG.doneTitle); $("doneNote").textContent = tr("c:doneNote", CONFIG.doneNote); }
}
$("langPick").addEventListener("change", e => {
  LANG = e.target.value; try { localStorage.setItem("courseLang", LANG); } catch(_){}
  applyLangAttrs(); applyStatic();
  if (!$("segmentCard").classList.contains("hidden")) localizeSegment(true);
});

function renderProgress(){
  const p = $("progress"); p.innerHTML = "";
  CONFIG.segments.forEach((_, i) => {
    const s = document.createElement("span");
    if (i < state.idx) s.className = "done";
    else if (i === state.idx && state.name) s.className = "current";
    p.appendChild(s);
  });
}

function showSegment(i){
  const seg = CONFIG.segments[i];
  state.idx = i; state.attempts = 0; state.watched = !CONFIG.requireFullWatch; state.startedAt = new Date();
  $("startCard").classList.add("hidden"); $("doneCard").classList.add("hidden");
  $("segmentCard").classList.remove("hidden");
  const st = segKind(seg);
  $("videoWrap").classList.toggle("hidden", st !== "video"); $("textBody").classList.toggle("hidden", st !== "text"); $("gallery").classList.toggle("hidden", st !== "photo");
  const noQuiz = isNoQuiz(seg);
  const answerNote = noQuiz ? null : "answerBelow";
  if (st === "text") { destroyPlayers(); state.watched = true; setNote(answerNote); $("notes").classList.add("hidden"); }
  else if (st === "photo") { destroyPlayers(); state.watched = true; renderGallery(seg); setNote(answerNote); }
  else if (!(seg.video || "").trim()) { destroyPlayers(); state.watched = true; setNote(answerNote); }   // placeholder is drawn in localizeSegment
  else {
    const kind = renderVideo(seg);
    // BoxCast and Google Drive players give no "ended" signal, so the quiz can't be gated on them.
    if (kind === "boxcast" || kind === "gdrive") state.watched = true;
    setNote((CONFIG.requireFullWatch && !state.watched) ? (noQuiz ? "watchToContinue" : "watchToUnlock") : answerNote);
  }
  $("status").textContent = "";
  $("quiz").classList.toggle("locked", !state.watched);
  localizeSegment(false);
  renderProgress();
  window.scrollTo({top:0, behavior:"smooth"});
}
const segKind = seg => seg.type === "text" ? "text" : seg.type === "photo" ? "photo" : "video";
function setNote(key){ state.noteKey = key; $("videoNote").textContent = key ? ui(key) : ""; }

// Fill every translatable part of the current section. keepAnswers = the learner switched language mid-section.
function localizeSegment(keepAnswers){
  const i = state.idx, seg = CONFIG.segments[i]; if (!seg) return;
  const st = segKind(seg);
  $("segTitle").textContent = segT(seg, "title");

  const walk = node => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 3) return;
      if (ch.nodeType !== 1 || !(ch.tagName in ALLOWED)) { ch.replaceWith(...(ch.childNodes ? [...ch.childNodes] : [])); return walk(node); }
      [...ch.attributes].forEach(a => { if (!ALLOWED[ch.tagName].includes(a.name)) ch.removeAttribute(a.name); });
      if (ch.tagName === "A") { const h = ch.getAttribute("href") || ""; if (!/^https?:\/\/|^mailto:/i.test(h)) ch.removeAttribute("href"); else { ch.target = "_blank"; ch.rel = "noopener"; } }
      if (ch.tagName === "IMG") { const src = ch.getAttribute("src") || ""; if (!/^https?:\/\//i.test(src)) { ch.remove(); return walk(node); } ch.style.cssText = "max-width:100%;height:auto;cursor:zoom-in"; }
      walk(ch);
    });
  };
  walk(doc.body);
  return doc.body.innerHTML;
}
function linkify(text){
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}

$("startForm").addEventListener("submit", e => {
  e.preventDefault();
  state.name = $("name").value.trim(); state.email = $("email").value.trim();
  $("who").textContent = `${state.name} · ${state.email}`;
  showSegment(0);
});

$("quizForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!state.watched) return;
  const seg = CONFIG.segments[state.idx];
  state.attempts++;
  const noQuiz = isNoQuiz(seg);
  const questions = noQuiz ? [] : seg.questions;
  const answers = questions.map((_, qi) => Number(new FormData(e.target).get(`q${qi}`)));
  const results = answers.map((a, qi) => a === questions[qi].answer);
  const correct = results.filter(Boolean).length, total = questions.length;
  const passed = noQuiz ? true : (CONFIG.requireAllCorrect ? correct === total : true);

  // Mark options
  questions.forEach((qu, qi) => {
    const labs = e.target.querySelectorAll(`input[name=q${qi}]`);
    labs.forEach((inp) => {
      const lab = inp.parentElement; lab.classList.remove("correct","wrong");
      if (Number(inp.value) === answers[qi]) lab.classList.add(results[qi] ? "correct" : "wrong");
      else if (CONFIG.revealCorrect && Number(inp.value) === qu.answer) lab.classList.add("correct");
    });
  });

  const entry = {
    name: state.name, email: state.email,
    submittedAt: new Date().toISOString(),
    submittedAtLocal: new Date().toLocaleString(),
    course: CONFIG.courseTitle,
    segment: state.idx + 1, segmentTitle: seg.title,
    attempt: state.attempts, score: noQuiz ? "viewed" : `${correct}/${total}`, passed,
    answers: noQuiz ? "(no quiz)" : answers.map((a, qi) => questions[qi].options[a] ?? "").join(" | "),
    secondsOnSegment: Math.round((Date.now() - state.startedAt.getTime())/1000),
    completedCourse: passed && state.idx === CONFIG.segments.length - 1,
    language: LANG
  };
  state.log.push(entry);
  const btn = e.target.querySelector("button"); btn.disabled = true;
  $("status").textContent = ui(noQuiz ? "recordingShort" : "recording");
  await logSubmission(entry);
  btn.disabled = false;

  if (passed) {
    $("status").innerHTML = noQuiz ? "" : `<span class="feedback ok">${esc(ui("correct", { score: `${correct}/${total}` }))}</span>`;
    setTimeout(() => {
      if (state.idx + 1 < CONFIG.segments.length) showSegment(state.idx + 1);
      else finish();
    }, noQuiz ? 150 : 900);
  } else {
    $("status").innerHTML = `<span class="feedback bad">${esc(ui("tryAgain", { score: `${correct}/${total}` }))}</span>`;
  }
});

function finish(){
  state.idx = CONFIG.segments.length; renderProgress();
  $("segmentCard").classList.add("hidden"); $("doneCard").classList.remove("hidden");
  $("doneTitle").textContent = tr("c:doneTitle", CONFIG.doneTitle); $("doneNote").textContent = tr("c:doneNote", CONFIG.doneNote);
  // Tell a parent page (e.g. Squarespace) that the course finished, if embedded in an iframe.
  try { window.parent.postMessage({ type:"course-complete", name:state.name, email:state.email }, "*"); } catch(_){}
}

async function logSubmission(entry){
  // Always keep a local copy (handy for debugging; visible via localStorage "courseLog").
  try { const l = JSON.parse(localStorage.getItem("courseLog")||"[]"); l.push(entry); localStorage.setItem("courseLog", JSON.stringify(l)); } catch(_){}
  if (!CONFIG.logEndpoint) return;
  try {
    // text/plain avoids a CORS preflight, which Apps Script web apps do not answer.
    await fetch(CONFIG.logEndpoint, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify(entry) });
  } catch(err) { console.warn("Log failed", err); }
}

// Init: fetch the published course content, then render.
async function loadRemoteConfig(){
  // Preview mode: admin.html passes its unpublished draft via sessionStorage.
  if (new URLSearchParams(location.search).get("preview") === "1") {
    try {
      const draft = JSON.parse(sessionStorage.getItem("coursePreviewConfig") || "null");
      if (draft) { CONFIG = Object.assign({}, CONFIG, draft, { logEndpoint: "" }); state.preview = true; return; }
    } catch(_){}
  }
  if (!CONFIG.logEndpoint) return;
  try {
    const r = await fetch(CONFIG.logEndpoint + "?action=config&t=" + Date.now());
    const data = await r.json();
    if (data.ok && data.config && Array.isArray(data.config.segments) && data.config.segments.length) {
      CONFIG = Object.assign({}, CONFIG, data.config, { logEndpoint: CONFIG.logEndpoint });
    }
  } catch (err) { console.warn("Using built-in course content; backend unreachable:", err); }
}
(async () => {
  $("courseIntro").textContent = UI.loading;
  await loadRemoteConfig();
  state.ccOn = CONFIG.captionsOn !== false;
  initLanguages();
  applyStatic();
  renderProgress();
})();
</script>
